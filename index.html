<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b6b30" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lawnwave" />
    <meta name="description"
        content="Track when you last cut each lawn and get the best day to mow based on the Summerville, SC weather." />
    <title>Lawnwave · Best Day to Cut</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <style>
        :root {
            --radius: 20px;
            --shadow: 0 14px 34px rgba(15, 40, 25, .22);
            --text: #10241a;
            --muted: rgba(16, 36, 26, .62);
            --card-bg: rgba(255, 255, 255, .72);
            --card-border: rgba(255, 255, 255, .85);
            --green: #2f9e44;
            --green-bg: #d3f9d8;
            --green-border: #69db7c;
            --yellow: #e67700;
            --yellow-bg: #fff3bf;
            --yellow-border: #ffd43b;
            --red: #c92a2a;
            --red-bg: #ffe3e3;
            --red-border: #ff8787;
            --blue-bg: #eaf3ff;
            --blue-border: #b9d7f5;
        }

        html {
            font-size: 16px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(165deg, #b2f2bb 0%, #69db7c 45%, #2f9e44 100%);
            background-attachment: fixed;
            padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .hidden {
            display: none !important
        }

        .app {
            max-width: 560px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .glass {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px)
        }

        /* ---------- Header ---------- */
        header.glass {
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .brand-row .logo {
            width: 44px;
            height: 44px;
            flex: 0 0 auto
        }

        .brand-row h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -.02em
        }

        .brand-row .sub {
            font-size: .82rem;
            color: var(--muted)
        }

        /* ---------- Recommendation hero ---------- */
        .rec {
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .rec .rec-label {
            font-size: .78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted)
        }

        .rec .rec-main {
            font-size: 1.5rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -.02em
        }

        .rec .rec-detail {
            font-size: .92rem;
            color: var(--muted);
            line-height: 1.5
        }

        .rec .rec-detail b {
            color: var(--text)
        }

        .rec.is-good .rec-main {
            color: #1b6b30
        }

        .rec.is-neutral .rec-main {
            color: #10241a
        }

        .rec.is-warn .rec-main {
            color: #c92a2a
        }

        .rec .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: .8rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 999px;
            width: fit-content
        }

        .badge.good {
            background: var(--green-bg);
            color: #1b6b30;
            border: 1px solid var(--green-border)
        }

        .badge.warn {
            background: var(--red-bg);
            color: #c92a2a;
            border: 1px solid var(--red-border)
        }

        .badge.neutral {
            background: rgba(16, 36, 26, .08);
            color: var(--muted);
            border: 1px solid rgba(16, 36, 26, .15)
        }

        /* ---------- Section title ---------- */
        .section-title {
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: rgba(255, 255, 255, .85);
            padding: 0 4px
        }

        /* ---------- Property cards ---------- */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .card {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            border-left: 6px solid transparent;
            transition: transform .12s ease
        }

        .card:active {
            transform: scale(.99)
        }

        .card .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0
        }

        .card .name {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -.01em
        }

        .card .last {
            font-size: .82rem;
            color: var(--muted)
        }

        .card .days {
            font-size: .8rem;
            font-weight: 700
        }

        .card .history {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(16, 36, 26, .12);
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .card .history-label {
            font-size: .7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted)
        }

        .card .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .card .history-list li {
            font-size: .78rem;
            color: var(--muted);
            padding-left: 14px;
            position: relative
        }

        .card .history-list li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: .5em;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: .5
        }

        .card .status-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle
        }

        .card .cut-btn {
            flex: 0 0 auto;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: .85rem;
            font-weight: 700;
            padding: 11px 16px;
            border-radius: 14px;
            background: #1b6b30;
            color: #fff;
            box-shadow: 0 6px 16px rgba(27, 107, 48, .35);
            transition: transform .1s ease, background .15s ease
        }

        .card .cut-btn:active {
            transform: scale(.96)
        }

        .card .cut-btn.done {
            background: #e9facb;
            color: #1b6b30;
            box-shadow: none
        }

        /* status colors */
        .card.green {
            background: var(--green-bg);
            border-color: var(--green-border);
            border-left-color: var(--green)
        }

        .card.green .status-dot {
            background: var(--green)
        }

        .card.green .days {
            color: #1b6b30
        }

        .card.yellow {
            background: var(--yellow-bg);
            border-color: var(--yellow-border);
            border-left-color: var(--yellow)
        }

        .card.yellow .status-dot {
            background: var(--yellow)
        }

        .card.yellow .days {
            color: #e67700
        }

        .card.red {
            background: var(--red-bg);
            border-color: var(--red-border);
            border-left-color: var(--red)
        }

        .card.red .status-dot {
            background: var(--red)
        }

        .card.red .days {
            color: #c92a2a
        }

        /* ---------- 7-day forecast strip ---------- */
        .forecast {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .forecast .frow {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center
        }

        .forecast .fday {
            font-weight: 700;
            font-size: .95rem
        }

        .forecast .fmeta {
            font-size: .8rem;
            color: var(--muted)
        }

        .forecast .fright {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .forecast .ftemp {
            font-weight: 800;
            font-size: 1rem
        }

        .forecast .frain {
            font-size: .8rem;
            color: var(--muted)
        }

        .forecast .best-tag {
            font-size: .68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #1b6b30;
            background: var(--green-bg);
            border: 1px solid var(--green-border);
            padding: 2px 8px;
            border-radius: 999px;
            width: fit-content;
            margin-left: 8px
        }

        /* ---------- Backup (export / import) ---------- */
        .data {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .data-note {
            font-size: .82rem;
            color: var(--muted);
            line-height: 1.5
        }

        .data-actions {
            display: flex;
            gap: 10px
        }

        .data-btn {
            flex: 1;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: .9rem;
            font-weight: 700;
            padding: 12px 16px;
            border-radius: 14px;
            background: #1b6b30;
            color: #fff;
            box-shadow: 0 6px 16px rgba(27, 107, 48, .3);
            transition: transform .1s ease, background .15s ease
        }

        .data-btn:active {
            transform: scale(.97)
        }

        .data-btn.secondary {
            background: #e9facb;
            color: #1b6b30;
            box-shadow: none
        }

        .data-msg {
            font-size: .8rem;
            font-weight: 600;
            min-height: 1em
        }

        .data-msg.ok {
            color: #1b6b30
        }

        .data-msg.err {
            color: #c92a2a
        }

        /* ---------- Overlay / error ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 40, 25, .35);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px)
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .error-box {
            padding: 18px 20px;
            background: var(--red-bg);
            border: 1px solid var(--red-border);
            border-left: 6px solid var(--red);
            color: #c92a2a;
            font-size: .9rem;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px
        }

        .error-box button {
            border: none;
            background: #c92a2a;
            color: #fff;
            font-weight: 700;
            font-family: inherit;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            flex: 0 0 auto
        }

        footer {
            text-align: center;
            font-size: .74rem;
            color: rgba(255, 255, 255, .8);
            padding: 4px 8px
        }

        footer a {
            color: rgba(255, 255, 255, .95);
            font-weight: 600
        }

        /* ---------- Forecast freshness + icons ---------- */
        .section-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            padding: 0 4px
        }

        .wx-status {
            font-size: .72rem;
            font-weight: 600;
            color: rgba(255, 255, 255, .85);
            text-align: right
        }

        .wx-status.stale {
            color: #ffe066;
            font-weight: 700
        }

        /* ---------- Forecast icon column (overrides earlier grid) ---------- */
        .forecast .frow {
            grid-template-columns: auto 1fr auto
        }

        .ficon {
            font-size: 1.5rem;
            line-height: 1
        }

        /* ---------- Cut analytics ---------- */
        .card-stats {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(16, 36, 26, .12);
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .stat-line {
            font-size: .75rem;
            color: var(--muted)
        }

        .spark-row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .spark-label {
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted)
        }

        /* ---------- Daily alerts ---------- */
        .alerts {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .alert-note {
            font-size: .84rem;
            color: var(--muted);
            line-height: 1.5
        }

        .alert-ver {
            margin-top: auto;
            padding-top: 4px;
            font-size: .62rem;
            letter-spacing: .04em;
            text-align: right;
            color: var(--muted);
            opacity: .55
        }

        .alert-toast {
            margin-top: 2px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: .84rem;
            font-weight: 700;
            color: #1b6b30;
            background: var(--green-bg);
            border: 1px solid var(--green-border);
            animation: toast-in .25s ease-out;
            transition: opacity .4s, transform .4s
        }

        .alert-toast.warn {
            color: #7c4a03;
            background: var(--yellow-bg);
            border-color: var(--yellow-border)
        }

        .grant-banner {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: .86rem;
            line-height: 1.5;
            color: #0f4c8a;
            background: var(--blue-bg, #eaf3ff);
            border: 1px solid var(--blue-border, #b9d7f5)
        }

        .alert-toast.out {
            opacity: 0;
            transform: translateY(-6px)
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateY(8px) }
            to { opacity: 1; transform: none }
        }

        @media (max-width: 380px) {
            .card {
                flex-direction: column;
                align-items: stretch
            }

            .card .cut-btn {
                width: 100%
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="glass">
            <div class="brand-row">
                <img class="logo" src="icon.svg" alt="" />
                <div>
                    <h1>Lawnwave</h1>
                    <div class="sub">Best day to cut · Summerville, SC</div>
                </div>
            </div>
        </header>

        <!-- Recommendation -->
        <section class="glass rec" id="rec" aria-live="polite">
            <div class="rec-label">Recommendation</div>
            <div class="rec-main" id="recMain">Checking the forecast…</div>
            <div class="rec-detail" id="recDetail"></div>
        </section>

        <!-- 7-day forecast -->
        <div class="section-title-row">
            <span class="section-title">Next 7 Days</span>
            <span id="wxStatus" class="wx-status" role="status"></span>
        </div>
        <section class="glass forecast" id="forecast" aria-label="Seven day forecast"></section>

        <!-- Property cards -->
        <div class="section-title">Your Lawns</div>
        <div class="cards" id="cards"></div>

        <!-- Daily alerts -->
        <div class="section-title">Daily Alerts</div>
        <section class="glass alerts" id="alerts" aria-label="Daily mowing alerts"></section>

        <!-- Data: export / import -->
        <div class="section-title">Backup</div>
        <section class="glass data" aria-label="Backup and restore">
            <p class="data-note">Save your cut logs to a file (e.g. in Google Drive), or restore them on a new device.
            </p>
            <div class="data-actions">
                <button class="data-btn" id="exportBtn" type="button">⬇ Export</button>
                <button class="data-btn" id="importBtn" type="button">⬆ Import</button>
            </div>
            <div class="data-msg" id="dataMsg" role="status" aria-live="polite"></div>
            <input type="file" id="importFile" accept=".json,application/json" class="hidden" />
        </section>

        <footer>
            Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
            Cut logs are saved on this device.
        </footer>
    </div>

    <!-- Loading overlay -->
    <div class="overlay hidden" id="overlay">
        <div class="spinner"></div>
    </div>

    <script>
        "use strict";

        /* ============================================================
         *  Configuration
         * ============================================================ */
        const PROPERTIES = [
            { id: "osha", name: "Osha's House" },
            { id: "mine", name: "My House" },
            { id: "hoa", name: "HOA Property" },
        ];

        // Summerville, South Carolina
        const LAT = 33.1291;
        const LON = -80.1154;
        const WX_URL = "https://api.open-meteo.com/v1/forecast";

        // Status thresholds (days since last cut)
        const GREEN_MAX = 8;   // < 8 days  -> green
        const YELLOW_MAX = 12; // 8–12 days -> yellow, > 12 -> red

        // Scoring horizon: Open-Meteo's free tier gives ~16 daily values. We ask for a full week and
        // score the WHOLE window so "a drier day may come" is an actual recommendation
        // instead of a shrug when the first days are wet.
        const FORECAST_DAYS = 7; // full forecast window — also the best-mowing-day scoring horizon

        const LS_KEY = "lawnMower.lastCut.v1";
        const LS_WX = "lawnMower.weather.v2";

        /* ---------- Weather icons (Open-Meteo WMO weather_code) ---------- */
        function wxIcon(code, rainPct) {
            code = code ?? 0;
            if (code === 0 || code === 1) return "☀️";
            if (code === 2) return "⛅";
            if (code === 3) return "☁️";
            if (code === 45 || code === 48) return "🌫️";
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "🌧️";
            if (code === 95) return "⛈️";
            if (code >= 71 && code <= 78) return "❄️";
            // Cloudy but likely to rain: hint at it rather than a misleading sun.
            return rainPct > 50 ? "🌦️" : "☁️";
        }

        /* ---------- Best time-of-day window (hourly dew point / wind) ---------- */
        const H = 1000 * 60 * 60;

        // Find when grass is mowable that day: dry (dew-point spread ≥ 8°F so it
        // isn't just wet air), not too hot (<95°F — you don't want to scorch a
        // freshly cut lawn) and calm-ish wind (<20 mph). Returns null if the
        // whole window is marginal. All date math uses local Date objects so
        // the "already past" filter works regardless of timezone.
        function bestMowWindow(day, nowTs = Date.now()) {
            const h = day.hourly;
            if (!h || !h.length) return null;
            const m = new Date(day.date + "T12:00:00");
            const noon = new Date(m.getFullYear(), m.getMonth(), m.getDate(), 12).getTime();
            let start = -1, end = -1;
            for (let i = 0; i < h.length; i++) {
                const hh = +String(h.time[i]).slice(0, 2);
                const ts = noon + (hh - 12) * H;
                if (ts <= nowTs || hh >= 17) continue; // skip hours already past / after ~5pm
                const spread = h.temperature_2m[i] - h.dew_point_2m[i];
                const ok = spread >= 8 && h.temperature_2m[i] < 95 && h.wind_speed_10m[i] < 20;
                if (ok) {
                    if (start === -1) start = i;
                    end = i;
                }
            }
            if (start === -1) return null;
            const fmt = (i) => new Date(m.getFullYear(), m.getMonth(), m.getDate(), +String(h.time[i]).slice(0, 2))
                .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            // Drying time: first morning hour (before the window starts) when
            // dew has burned off — temp ≥ dew point means the air is drier than
            // the grass.
            let dryAt = null;
            for (let i = 0; i <= start; i++) {
                const hh = +String(h.time[i]).slice(0, 2);
                if (hh >= 17 || noon + (hh - 12) * H > nowTs) continue;
                if (h.dew_point_2m[i] !== null && h.temperature_2m[i] - h.dew_point_2m[i] >= 0.5) {
                    dryAt = new Date(m.getFullYear(), m.getMonth(), m.getDate(), hh);
                }
            }
            return { start: fmt(start), end: fmt(end), dryAt };
        }

        /* ---------- Cut analytics (data already in localStorage) ---------- */
        function monthCuts(history) {
            const m = new Date().getMonth(), y = new Date().getFullYear();
            return history.filter((t) => { const d = new Date(t); return d.getMonth() === m && d.getFullYear() === y; }).length;
        }

        // Last up-to-6 intervals (days between consecutive cuts, oldest→newest).
        function intervalSeries(history) {
            if (history.length < 2) return [];
            const asc = [...history].sort((a, b) => a - b);
            const DAY_MS = H * 24;
            const out = [];
            for (let i = Math.max(1, asc.length - 6); i < asc.length; i++) {
                out.push(Math.max(0, Math.round((asc[i] - asc[i - 1]) / DAY_MS)));
            }
            return out;
        }

        // Tiny inline SVG sparkline (values left→right).
        function sparkSVG(values) {
            const w = 74, hgt = 24, pad = 3;
            if (!values.length) return "";
            const max = Math.max(...values);
            const min = Math.min(...values);
            const span = Math.max(1, max - min);
            const pts = values.map((v, i) => {
                const x = pad + (i * (w - 2 * pad)) / Math.max(1, values.length - 1);
                const y = hgt - pad - ((v - min) / span) * (hgt - 2 * pad);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            });
            return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" aria-hidden="true">` +
                `<polyline points="${pts.join(" ")}" fill="none" stroke="#2f9e44" stroke-width="1.6" ` +
                `stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        }

        function statsFor(history) {
            const n = history.length;
            if (!n) return null;
            const series = intervalSeries(history);
            let avgInt = null, trend = "";
            if (series.length >= 2) {
                avgInt = Math.round(series.reduce((a, b) => a + b, 0) / series.length);
                const half = Math.floor(series.length / 2);
                const older = series.slice(0, half).reduce((a, b) => a + b, 0) / half;
                const newer = series.slice(half).reduce((a, b) => a + b, 0) / (series.length - half);
                if (newer < older * 0.9) trend = "shortening — you're cutting more often";
                else if (newer > older * 1.1) trend = "lengthening — you're cutting less often";
            }
            return { n, avgInt, series, trend };
        }

        function appendCardStats(info, history) {
            const s = statsFor(history);
            if (!s || s.n < 2) return; // need at least two cuts to say anything
            const box = document.createElement("div");
            box.className = "card-stats";

            let line1;
            if (s.avgInt != null) {
                line1 = `Avg interval: ${s.avgInt} days`;
                if (s.trend) line1 += ` · trend ${s.trend}`;
            } else {
                line1 = "Not enough cuts yet for a pattern";
            }
            const l1 = document.createElement("div");
            l1.className = "stat-line";
            l1.textContent = `${line1} · ${monthCuts(history)} cut${monthCuts(history) === 1 ? "" : "s"} this month`;
            box.appendChild(l1);

            if (s.series.length >= 2) {
                const row = document.createElement("div");
                row.className = "spark-row";
                const lbl = document.createElement("span");
                lbl.className = "spark-label";
                lbl.textContent = "Last cuts (days apart)";
                const svgWrap = document.createElement("span");
                svgWrap.innerHTML = sparkSVG(s.series);
                row.append(lbl, svgWrap);
                box.appendChild(row);
            }
            info.appendChild(box);
        }

        /* Cache the last good forecast so a failed live fetch (offline, etc.)
           still shows weather instead of a blank section. */
        function saveWeather(days) {
            try { localStorage.setItem(LS_WX, JSON.stringify({ at: Date.now(), days })); } catch { /* ignore */ }
        }

        // Full cached forecast envelope ({at, days}) or null — used by the UI to
        // flag stale/offline data and by the background-sync notification path.
        function loadWeatherEnvelope() {
            try {
                const c = JSON.parse(localStorage.getItem(LS_WX));
                if (c && Array.isArray(c.days) && c.days.length && c.at) return c;
            } catch { /* ignore */ }
            return null;
        }

        function loadCachedWeather() {
            const env = loadWeatherEnvelope();
            return env ? env.days : null;
        }

        // "Updated 6:12 AM" / "Updated yesterday · offline" for the forecast header.
        function wxStatusText(envelope) {
            if (!envelope || !envelope.at) return "";
            const d = new Date(envelope.at);
            let when;
            if (d.toDateString() === new Date().toDateString()) {
                when = "Updated " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            } else {
                when = "Updated " + d.toLocaleDateString([], { month: "short", day: "numeric" }) +
                    " at " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            }
            return envelope.offline ? when + " · offline" : when;
        }

        function renderWxStatus() {
            const el = $("wxStatus");
            if (!el) return;
            const text = wxStatusText(state.wxEnvelope);
            el.textContent = text;
            el.classList.toggle("stale", !!(text && state.wxEnvelope && state.wxEnvelope.offline));
        }

        /* ============================================================
         *  State
         * ============================================================ */
        function loadCuts() {
            let data;
            try {
                data = JSON.parse(localStorage.getItem(LS_KEY)) || {};
            } catch {
                return {};
            }
            // Migrate the old single-timestamp format into a history array.
            const out = {};
            PROPERTIES.forEach((p) => {
                const v = data[p.id];
                if (Array.isArray(v)) out[p.id] = v;
                else if (v) out[p.id] = [v];
            });
            return out;
        }

        function saveCuts(cuts) {
            localStorage.setItem(LS_KEY, JSON.stringify(cuts));
        }

        let cuts = loadCuts();

        // Return a property's cut history as a descending array of timestamps.
        function historyFor(id) {
            const raw = cuts[id];
            const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
            return arr
                .filter((t) => typeof t === "number" && isFinite(t) && t > 0)
                .sort((a, b) => b - a);
        }

        // Most recent cut timestamp for a property, or null.
        function lastCut(id) {
            const h = historyFor(id);
            return h.length ? h[0] : null;
        }

        /* ============================================================
         *  Helpers
         * ============================================================ */
        const $ = (id) => document.getElementById(id);

        function daysSince(ts) {
            if (!ts) return null;
            const ms = Date.now() - ts;
            return Math.floor(ms / (1000 * 60 * 60 * 24));
        }

        function statusFor(days) {
            if (days === null) return "red"; // never cut -> treat as overdue
            if (days < GREEN_MAX) return "green";
            if (days <= YELLOW_MAX) return "yellow";
            return "red";
        }

        function lastCutText(ts) {
            if (!ts) return "Never cut";
            const d = new Date(ts);
            const days = daysSince(ts);
            const dateStr = d.toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
            let daysStr;
            if (days === 0) daysStr = "Today";
            else if (days === 1) daysStr = "1 day ago";
            else daysStr = `${days} days ago`;
            return `${daysStr} (${dateStr})`;
        }

        function showOverlay(on) {
            $("overlay").classList.toggle("hidden", !on);
        }

        /* ============================================================
         *  Render property cards
         * ============================================================ */
        function renderCards() {
            const wrap = $("cards");
            wrap.innerHTML = "";
            PROPERTIES.forEach((p) => {
                const history = historyFor(p.id);
                const ts = history.length ? history[0] : null;
                const days = daysSince(ts);
                const status = statusFor(days);

                const card = document.createElement("div");
                card.className = `card ${status}`;

                const info = document.createElement("div");
                info.className = "info";

                const name = document.createElement("div");
                name.className = "name";
                name.textContent = p.name;

                const last = document.createElement("div");
                last.className = "last";
                last.textContent = lastCutText(ts);

                const daysEl = document.createElement("div");
                daysEl.className = "days";
                daysEl.innerHTML = `<span class="status-dot"></span>`;
                const label = document.createElement("span");
                if (status === "green") label.textContent = "Fresh";
                else if (status === "yellow") label.textContent = "Due soon";
                else if (days === null) label.textContent = "";
                else label.textContent = "Overdue";
                daysEl.appendChild(label);

                info.append(name, last, daysEl);

                // Last 3 cut dates (most recent first).
                const recent = history.slice(0, 3);
                if (recent.length) {
                    const hist = document.createElement("div");
                    hist.className = "history";
                    const histLabel = document.createElement("span");
                    histLabel.className = "history-label";
                    histLabel.textContent = "Last 3 cuts:";
                    hist.appendChild(histLabel);
                    const ul = document.createElement("ul");
                    ul.className = "history-list";
                    recent.forEach((t) => {
                        const li = document.createElement("li");
                        li.textContent = lastCutText(t);
                        ul.appendChild(li);
                    });
                    hist.appendChild(ul);
                    info.appendChild(hist);
                }

                // Aggregated analytics (avg interval, trend, cuts this month).
                appendCardStats(info, history);

                const btn = document.createElement("button");
                btn.className = "cut-btn";
                btn.type = "button";
                btn.textContent = "✓ I cut this";
                btn.addEventListener("click", () => logCut(p.id, btn));

                card.append(info, btn);
                wrap.appendChild(card);
            });
        }

        function logCut(id, btn) {
            const now = Date.now();
            const existing = historyFor(id);
            // Avoid logging the same calendar day twice in a row.
            const sameDay = existing.length &&
                new Date(existing[0]).toDateString() === new Date(now).toDateString();
            cuts[id] = sameDay ? existing : [now, ...existing].slice(0, 20);
            saveCuts(cuts);
            renderCards();
            renderRecommendation(); // status may have changed (e.g. all green now)
            renderAlerts();         // the daily digest's "most overdue" line changes too
            if (btn) {
                btn.classList.add("done");
                btn.textContent = "Logged!";
                setTimeout(() => {
                    btn.classList.remove("done");
                    btn.textContent = "✓ I cut this";
                }, 1600);
            }
        }

        /* ============================================================
         *  Weather + recommendation
         * ============================================================ */
        async function fetchJSON(url) {
            let res;
            try {
                res = await fetch(url);
            } catch {
                throw new Error("network");
            }
            if (!res.ok) throw new Error("http");
            return res.json();
        }

        // Score a single day: higher is better for mowing.
        // We want LOW rain probability and a COMFORTABLE temperature
        // (grass dries and cuts cleanly around 65–78°F; very hot or
        // very cold is worse).
        function scoreDay(day) {
            const rain = day.precipitation_probability_max ?? 0;
            const precipSum = day.precipitation_sum ?? 0; // mm
            const temp = ((day.temperature_2m_max ?? 75) + (day.temperature_2m_min ?? 65)) / 2;

            // Rain: 0% -> 100, 100% -> 0. Heavier rain penalized a bit more.
            let rainScore = 100 - rain;
            rainScore -= Math.min(30, precipSum * 4);

            // Temperature: ideal band centered ~72°F.
            const tempDist = Math.abs(temp - 72);
            let tempScore = Math.max(0, 100 - tempDist * 3.2);

            return { score: rainScore * 0.65 + tempScore * 0.35, rain, temp };
        }

        function renderForecast(days, bestIdx) {
            const wrap = $("forecast");
            wrap.innerHTML = "";
            days.forEach((d, i) => {
                const row = document.createElement("div");
                row.className = "frow";

                const iconEl = document.createElement("div");
                iconEl.className = "ficon";
                iconEl.textContent = wxIcon(d.weather_code ?? 0, d.precipitation_probability_max);

                const left = document.createElement("div");
                const dayName = new Date(d.date + "T12:00:00").toLocaleDateString([], {
                    weekday: "short",
                    month: "short",
                    day: "numeric"
                });
                const fday = document.createElement("div");
                fday.className = "fday";
                fday.textContent = dayName;
                if (i === bestIdx) {
                    const tag = document.createElement("span");
                    tag.className = "best-tag";
                    tag.textContent = "Best day";
                    fday.appendChild(tag);
                }
                const fmeta = document.createElement("div");
                fmeta.className = "fmeta";
                fmeta.textContent = `High ${Math.round(d.temperature_2m_max)}° · Low ${Math.round(d.temperature_2m_min)}°`;
                left.append(fday, fmeta);

                const right = document.createElement("div");
                right.className = "fright";
                const ftemp = document.createElement("div");
                ftemp.className = "ftemp";
                ftemp.textContent = `${Math.round(d.temperature_2m_max)}°F`;
                const frain = document.createElement("div");
                frain.className = "frain";
                frain.textContent = `💧 ${d.precipitation_probability_max ?? 0}% rain`;
                right.append(ftemp, frain);

                row.append(iconEl, left, right);
                wrap.appendChild(row);
            });
        }

        function renderRecommendation() {
            const rec = $("rec");
            const main = $("recMain");
            const detail = $("recDetail");
            rec.classList.remove("is-good", "is-neutral", "is-warn");

            const hasForecast = state.days && state.days.length;

            // All green -> no cut needed (still show the forecast below).
            const allGreen = PROPERTIES.every((p) => statusFor(daysSince(lastCut(p.id))) === "green");
            if (allGreen) {
                rec.classList.add("is-neutral");
                main.textContent = "No cut needed 🌱";
                detail.innerHTML = `All of your lawns were cut within the last ${GREEN_MAX} days. Enjoy the break — we'll flag a day when one starts to grow back.`;
                if (hasForecast) renderForecast(state.days, -1);
                return;
            }

            if (!hasForecast) {
                rec.classList.add("is-neutral");
                main.textContent = "Forecast unavailable";
                detail.textContent = "We couldn't load the weather, so we can't pick a day. Check your connection and pull to refresh.";
                $("forecast").innerHTML = "";
                return;
            }

            // Score the WHOLE window (7 days) — a drier day may come on day 4 or 6,
            // and that's now an actual recommendation.
            let bestIdx = 0, bestScore = -Infinity;
            state.days.forEach((d, i) => {
                const s = scoreDay(d).score;
                if (s > bestScore) { bestScore = s; bestIdx = i; }
            });
            const best = state.days[bestIdx];
            const bestInfo = scoreDay(best);
            const dayName = new Date(best.date + "T12:00:00").toLocaleDateString([], {
                weekday: "long", month: "short", day: "numeric"
            });
            // Human distance ("today", "tomorrow", "in 4 days") instead of a bare date.
            let when;
            if (bestIdx === 0) when = "Today";
            else if (bestIdx === 1) when = "Tomorrow";
            else when = `in ${bestIdx} days`;

            const worst = PROPERTIES
                .map((p) => ({ p, days: daysSince(lastCut(p.id)) }))
                .sort((a, b) => (b.days ?? 999) - (a.days ?? 999))[0];

            // Best time-of-day window for the recommended day (hourly data).
            const win = bestMowWindow(best);
            let winText = "";
            if (win) {
                let s = `Best window: <b>${win.start}–${win.end}</b>`;
                if (win.dryAt) s += `, grass dries by ~<b>${win.dryAt.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</b>`;
                winText = ` ${s}.`;
            }

            const overdueBit = `Most overdue: <b>${worst.p.name}</b>${worst.days === null ? " (never cut)" : ` (${worst.days} day${worst.days === 1 ? "" : "s"} ago)`}.`;

            if (bestInfo.rain <= 30) {
                rec.classList.add("is-good");
                main.textContent = dayName;
                detail.innerHTML =
                    `${when}: low rain chance (<b>${bestInfo.rain}%</b>) and a comfortable <b>${Math.round(bestInfo.temp)}°F</b> — the best day of the week.${winText} ${overdueBit}`;
            } else {
                rec.classList.add("is-warn");
                main.textContent = dayName;
                detail.innerHTML =
                    `It's the driest of the next ${Math.min(FORECAST_DAYS, state.days.length)} days (${when}), but rain chance is <b>${bestInfo.rain}%</b> and it's about <b>${Math.round(bestInfo.temp)}°F</b>. Nothing better shows up this week.${winText} ${overdueBit}`;
            }

            // The 7-day list highlights the GLOBAL best day (tag + hero agree).
            renderForecast(state.days, bestIdx);
        }

        const state = { days: null, wxEnvelope: null };

        async function loadWeather() {
            showOverlay(true);
            try {
                // Daily data for the full 7-day horizon + hourly dew point / wind
                // (only day-1 matters — that's where time-of-day advice applies).
                const url = `${WX_URL}?latitude=${LAT}&longitude=${LON}` +
                    `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,weather_code` +
                    `&hourly=temperature_2m,dew_point_2m,wind_speed_10m&wind_speed_unit=mph` +
                    `&temperature_unit=fahrenheit&timezone=auto&forecast_days=${FORECAST_DAYS}`;
                const data = await fetchJSON(url);
                // Open-Meteo returns parallel arrays; convert to an array of day objects.
                const d = data.daily;
                state.days = d.time.map((date, i) => ({
                    date,
                    temperature_2m_max: d.temperature_2m_max[i],
                    temperature_2m_min: d.temperature_2m_min[i],
                    precipitation_probability_max: d.precipitation_probability_max[i],
                    precipitation_sum: d.precipitation_sum[i],
                    weather_code: (d.weather_code || [])[i] ?? 0,
                }));
                // Attach the FIRST day's hourly series for time-of-day analysis.
                if (data.hourly && data.daily.time.length) {
                    const d0 = data.daily.time[0];
                    state.days[0].hourly = {
                        time: data.hourly.time.filter((t) => t.slice(0, 10) === d0),
                        temperature_2m: data.hourly.temperature_2m.filter((_, i) => data.hourly.time[i] && data.hourly.time[i].slice(0, 10) === d0),
                        dew_point_2m: data.hourly.dew_point_2m.filter((_, i) => data.hourly.time[i] && data.hourly.time[i].slice(0, 10) === d0),
                        wind_speed_10m: data.hourly.wind_speed_10m.filter((_, i) => data.hourly.time[i] && data.hourly.time[i].slice(0, 10) === d0),
                    };
                }
                state.wxEnvelope = { at: Date.now(), offline: false, days: state.days };
                saveWeather(state.days);
                renderRecommendation();
            } catch {
                // Live fetch failed — fall back to the last good forecast so the
                // section isn't blank (e.g. phone was offline when reopened).
                const env = loadWeatherEnvelope();
                state.wxEnvelope = env ? { at: env.at, offline: true, days: env.days } : null;
                state.days = env ? env.days : null;
                renderRecommendation();
            } finally {
                showOverlay(false);
                renderWxStatus();
            }
        }

        /* ============================================================
         *  Backup — export / import cut logs
         * ============================================================ */
        function dataMsg(text, kind) {
            const el = $("dataMsg");
            el.textContent = text || "";
            el.className = "data-msg" + (kind ? ` ${kind}` : "");
        }

        function exportCuts() {
            // Export each property's cut history (property id -> array of timestamps).
            const payload = {};
            PROPERTIES.forEach((p) => {
                const h = historyFor(p.id);
                if (h.length) payload[p.id] = h;
            });
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `lawnwave-backup-${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            dataMsg("Exported. Save the file somewhere safe (e.g. Google Drive).", "ok");
        }

        // Accept a number (epoch ms) or a date string like "2026-08-15" or
        // "2026-08-15 14:30" and return epoch ms, or null if it's not valid.
        function toTimestamp(v) {
            if (typeof v === "number" && isFinite(v) && v > 0) return v;
            if (typeof v === "string") {
                const s = v.trim();
                if (!s) return null;
                // Date only (YYYY-MM-DD): treat as local midnight so it shows
                // the same calendar day the user typed (avoids a UTC off-by-one).
                const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (m) {
                    const t = new Date(+m[1], +m[2] - 1, +m[3]).getTime();
                    if (!isNaN(t)) return t;
                }
                // Otherwise (has a time component): normalize and parse.
                const normalized = s.includes(" ") ? s.replace(" ", "T") : s;
                const t = Date.parse(normalized);
                if (!isNaN(t)) return t;
            }
            return null;
        }

        function importCuts(file) {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    // Accept either a flat {osha, mine, hoa} object or the older
                    // {cuts: {osha, mine, hoa}} shape.
                    const incoming = (parsed && typeof parsed === "object" && parsed.cuts)
                        ? parsed.cuts
                        : parsed;
                    if (!incoming || typeof incoming !== "object") throw new Error("bad");

                    // Accept a single value or an array of values per property.
                    const clean = {};
                    PROPERTIES.forEach((p) => {
                        const raw = incoming[p.id];
                        const list = Array.isArray(raw) ? raw : [raw];
                        const ts = list.map(toTimestamp).filter(Boolean).sort((a, b) => b - a);
                        if (ts.length) clean[p.id] = ts.slice(0, 20);
                    });

                    cuts = clean;
                    saveCuts(cuts);
                    renderCards();
                    renderRecommendation();
                    dataMsg(`Imported ${Object.keys(clean).length} propert${Object.keys(clean).length === 1 ? "y" : "ies"}.`, "ok");
                } catch {
                    dataMsg("Couldn't read that file — is it a Lawnwave backup?", "err");
                }
            };
            reader.onerror = () => dataMsg("Couldn't read the file.", "err");
            reader.readAsText(file);
        }

        function wireDataButtons() {
            $("exportBtn").addEventListener("click", exportCuts);
            $("importBtn").addEventListener("click", () => $("importFile").click());
            $("importFile").addEventListener("change", (e) => {
                const file = e.target.files && e.target.files[0];
                if (file) importCuts(file);
                e.target.value = ""; // allow re-importing the same file
            });
        }

        /* ============================================================
         *  Daily alerts — Notification API + Background Sync (sw.js)
         *  One short digest per day: best mowing window + any lawns that
         *  are due/overdue. Fires even with the app closed, because the
         *  service worker runs it in the background (Android: periodic;
         *  elsewhere: when the device is back online / on app open).
         * ============================================================ */
        const LS_ALERTS = "lawnMower.alerts.v1";
        const LS_NOTED = "lawnMower.alerts.lastNote";
        const APP_VERSION = 9; // bump with the sw.js cache name on every index.html change

        function loadAlertPrefs() {
            try { return JSON.parse(localStorage.getItem(LS_ALERTS)) || {}; } catch { return {}; }
        }
        function saveAlertPrefs(p) { localStorage.setItem(LS_ALERTS, JSON.stringify(p)); }

        // Today's digest text — the preview in the Alerts card and what a page-side
        // notification would say. The background sync builds its own copy from
        // raw localStorage (same shape).
        function buildDigest() {
            const env = state.wxEnvelope;
            const days = env ? env.days : null;
            let bestLine = "Best mowing day unknown — open Lawnwave to refresh the forecast";
            if (days && days.length) {
                let bi = 0, bs = -Infinity;
                days.forEach((d, i) => { const s = scoreDay(d).score; if (s > bs) { bs = s; bi = i; } });
                const b = days[bi];
                const info = scoreDay(b);
                const name = new Date(b.date + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
                bestLine = `${name} is your best mowing day (rain ${info.rain}%, ~${Math.round(info.temp)}°F)`;
            }

            // Most overdue / never-cut property. A never-cut lawn outranks any
            // overdue count; otherwise the highest days-since-last-cut wins.
            let worstName = null, worstDays = -1, worstNever = false;
            PROPERTIES.forEach((p) => {
                const ts = lastCut(p.id);
                const days = ts ? daysSince(ts) : null;
                if (days === null) {
                    worstNever = true;
                    worstName = p.name; // keep the first never-cut one seen
                } else if (!worstNever && days > worstDays) {
                    worstDays = days;
                    worstName = p.name;
                }
            });

            let dueLine = "All lawns fresh — no cuts due";
            if (worstNever) {
                dueLine = `${worstName} has never been cut`;
            } else if (worstDays >= GREEN_MAX) {
                dueLine = `${worstName} is ${worstDays} days since last cut${worstDays > YELLOW_MAX ? " — overdue" : ""}`;
            }
            return { title: "Lawnwave daily", body: bestLine + " · " + dueLine };
        }

        async function registerDailySync() {
            if (!("serviceWorker" in navigator)) return;
            try {
                const reg = await navigator.serviceWorker.ready;
                if (reg.sync) await reg.sync.register("lawnwave-daily"); // idempotent; keeps the cadence alive
            } catch { /* older browser — page-side nudge still works */ }
        }

        // Fallback for browsers without Background Sync (e.g. iOS Safari):
        // one notification per ~12h when the app is opened, if alerts are on.
        function maybeDailyNudge() {
            const prefs = loadAlertPrefs();
            if (!prefs.enabled) return;
            try {
                if (typeof Notification !== "undefined" && Notification.permission === "granted") {
                    const last = +localStorage.getItem(LS_NOTED) || 0;
                    if (Date.now() - last > 43200000) { // ~12h, shared with sw.js
                        localStorage.setItem(LS_NOTED, String(Date.now()));
                        const d = buildDigest();
                        new Notification(d.title, { body: d.body, icon: "icon.svg", tag: "lawnwave-daily" });
                    }
                }
            } catch { /* ignore */ }
        }

        // Confirmation feedback after enabling alerts: flip state is visible AND,
        // when permission allows, fire a real test notification so Android users
        // can see it land (and tap it to learn where notifications show up).
        function toastAlertsOn() {
            const wrap = $("alerts");
            if (!wrap) return;
            try {
                new Notification("Lawnwave daily", {
                    body: "You're all set — this is a test. You'll get one note like this each day.",
                    icon: "icon.svg", tag: "lawnwave-daily"
                });
            } catch { /* page-side notification unavailable — toast still shows */ }
            const t = document.createElement("div");
            t.className = "alert-toast";
            t.textContent = "Daily alerts are on ✓ (check your notification shade for the test note)";
            wrap.appendChild(t);
            setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 400); }, 5200);
        }

        function renderAlerts() {
            const wrap = $("alerts");
            if (!wrap) return;
            wrap.innerHTML = "";

            let perm = "unsupported";
            try { perm = Notification.permission; } catch { /* no API at all */ }
            const supported = perm !== "unsupported" && ("serviceWorker" in navigator);
            const prefs = loadAlertPrefs();

            const note = document.createElement("p");
            note.className = "alert-note";
            if (!supported) {
                note.textContent = "Daily alerts need notifications + a service worker (Chrome/Edge on Android, Safari 16+ on iPhone). Everything else works offline.";
            } else if (perm === "granted" && prefs.enabled) {
                const d = buildDigest();
                note.innerHTML = `On — you'll get one short note each day, like:<br><b>"${d.body}"</b>`;
            } else if (perm === "denied") {
                note.textContent = "Notifications are blocked in your browser settings for this site — allow them to get daily mowing alerts.";
            } else {
                note.textContent = "One short notification each day: the best mowing window and any lawns that are due. Works even with the app closed (add Lawnwave to your home screen).";
            }
            wrap.appendChild(note);

            if (!supported || perm === "denied") return;

            const btn = document.createElement("button");
            btn.type = "button";
            const on = perm === "granted" && prefs.enabled;
            btn.className = "data-btn" + (on ? " secondary" : "");
            btn.textContent = on ? "Turn off daily alerts" : "Enable daily alerts";

            let asking = false; // guards double-taps while Chrome's bar is up
            const toastWarn = (msg, ms) => {
                const t = document.createElement("div");
                t.className = "alert-toast warn";
                t.textContent = msg;
                wrap.appendChild(t);
                setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 400); }, ms || 6500);
            };

            btn.addEventListener("click", async () => {
                if (asking) return; // Chrome's permission bar is already on screen
                if (on) { prefs.enabled = false; }
                else if (perm === "granted") {
                    // Already granted — just flip the pref and prove it works.
                    prefs.enabled = true;
                    saveAlertPrefs(prefs);
                    toastAlertsOn();
                    registerDailySync();
                    renderAlerts();
                    return;
                } else {
                    asking = true;
                    let p;
                    try { p = await Notification.requestPermission({ overrideInteractionRequirement: true }); }
                    catch (e) { p = Notification.permission; } // Safari ignores the option

                    if (p === "granted") { prefs.enabled = true; toastAlertsOn(); }
                    else if (p === "denied") {
                        toastWarn("Notifications are blocked for this site — allow them in Chrome's site settings (address bar → 🔒/ℹ icon → Site settings), then tap again.");
                    } else {
                        // Still "default". On Android installed PWAs Edge/Chrome sometimes never
                        // shows its bottom permission bar, so the tap looks dead. Safety net:
                        // open a URL VARIANT in a real browser tab — ?src=grant typically breaks
                        // Edge's URL→installed-app matching (a plain location.href just re-launches
                        // this app standalone; user confirmed that loop). Granting there is
                        // origin-wide, so it fixes this installed app too. The link is also copied
                        // as a guaranteed backup if the popup got killed by a blocker.
                        let nowP = "default"; try { nowP = Notification.permission; } catch {}
                        if (nowP === "default") {
                            const grantUrl = location.href.split("#")[0] + (location.search ? "&" : "?") + "src=grant";
                            let copied = false;
                            try { await navigator.clipboard.writeText(grantUrl); copied = true; } catch {}
                            toastWarn("No permission bar appeared here. Opened Lawnwave in a regular Edge tab — tap “Enable daily alerts” there and hit Allow when the banner at the bottom edge shows." + (copied ? " (Link also copied as backup.)" : ""), 9000);
                            // location.href, NOT .origin: on GitHub Pages the site lives in a /Lawnwave subdirectory,
                            // so the bare origin root is a 404 (learned the hard way from user report).
                            try { window.open(grantUrl, "_blank", "noopener"); } catch {}
                        } else {
                            toastWarn("Almost! Look for the “Allow notifications?” banner at the very bottom of the screen and tap Allow.");
                        }
                    }
                    asking = false;
                }
                saveAlertPrefs(prefs);
                if (prefs.enabled) registerDailySync();
                renderAlerts();
            });
            wrap.appendChild(btn);

            // Tiny build tag: proves which app version this device actually loaded, so a
            // "nothing happens" report is instantly distinguishable from stale-shell.
            const ver = document.createElement("p");
            ver.className = "alert-ver";
            ver.textContent = `app v${APP_VERSION}`;
            wrap.appendChild(ver);
        }

        /* ============================================================
         *  ?src=grant — opened by the dead-tap safety net. A persistent (not
         *  fading) banner so a user who lands here can't miss what to do; on
         *  success renderAlerts() re-renders and replaces it with the "On" state.
         * ============================================================ */
        function showGrantBanner() {
            const wrap = $("alerts");
            if (!wrap) return;
            const b = document.createElement("div");
            b.className = "grant-banner";
            b.innerHTML = "<b>You're in the right place.</b> This is a regular Edge/Chrome tab — tap <b>Enable daily alerts</b> below and hit <b>Allow</b> when the banner appears at the very bottom edge of the screen. Once allowed, it works inside the installed app too.";
            wrap.appendChild(b);
        }

        /* ============================================================
         *  Init
         * ============================================================ */
        renderCards();
        loadWeather().then(() => { maybeDailyNudge(); });
        wireDataButtons();
        renderAlerts();
        try { if (new URLSearchParams(location.search).get("src") === "grant") showGrantBanner(); } catch {}

        // Refresh the forecast when the tab becomes visible again (e.g. returning to the app).
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) loadWeather();
        });

        /* ============================================================
         *  PWA — register the service worker for offline support.
         *  Only registers over http(s) or localhost (not file://), so it
         *  is a no-op when the page is opened directly from disk.
         * ============================================================ */
        if ("serviceWorker" in navigator &&
            (location.protocol === "https:" ||
                location.protocol === "http:" ||
                location.hostname === "localhost")) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch((err) => {
                    console.warn("Service worker registration failed:", err);
                });
            });
        }
    </script>
</body>
